name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ce-jei-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rainveil-mod client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use Java 21 for Gradle
        shell: bash
        run: |
          echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      - name: Run protocol tests
        working-directory: client
        shell: bash
        run: bash ./gradlew --no-daemon -p ../protocol protocolTest handshakeTest

      - name: Build Fabric client mod
        working-directory: client
        shell: bash
        run: bash ./gradlew --no-daemon clean build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-jei-bridge-${{ github.sha }}
          path: client/build/libs/Rainveil-mod-1.21.11-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish client mod release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ce-jei-bridge-${{ github.sha }}
          path: dist

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset="Rainveil-mod-1.21.11-1.0.1.jar"
          test -f "dist/$asset" || {
            echo "Missing release asset: dist/$asset" >&2
            exit 1
          }
          ( cd dist && sha256sum "$asset" > SHA256SUMS.txt )

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="latest"
            release_title="Latest main build"
            release_notes="Automatic build from main commit $GITHUB_SHA."
            release_create_flags=(--prerelease --latest=false)
          else
            release_tag="$GITHUB_REF_NAME"
            release_title="$GITHUB_REF_NAME"
            release_notes="Build artifacts for $GITHUB_REF_NAME."
            release_create_flags=(--verify-tag --generate-notes --latest=false)
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
            if [[ "$release_tag" == "latest" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                -f "sha=${GITHUB_SHA}" -F "force=true" >/dev/null
              gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes" --prerelease --latest=false
            fi
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes" \
              "${release_create_flags[@]}" dist/*
          fi
