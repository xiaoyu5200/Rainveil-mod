name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ce-jei-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CE-JEI Bridge artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use Java 21 for Gradle
        shell: bash
        run: |
          echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      - name: Verify bundled CraftEngine compile dependency
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "8771A23713BEABCFEFA46DD0B4C768D7EB1112DBDE803243C972C08EC157D406" "server/libs/craft-engine-paper-plugin-26.7.4.jar" \
            | sha256sum --check --status -

      - name: Run protocol tests
        working-directory: client
        shell: bash
        run: bash ./gradlew --no-daemon -p ../protocol protocolTest handshakeTest

      - name: Build Fabric 1.21.11 client
        working-directory: client
        shell: bash
        run: bash ./gradlew --no-daemon clean build

      - name: Build Paper 1.21.11 plugin with shadowJar
        working-directory: server
        shell: bash
        run: bash ./gradlew --no-daemon clean shadowJar -Ptarget=1.21.11

      - name: Stage release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp server/build/libs/CraftEngineClientBridge-1.0.2-1.21.11.jar dist/
          cp client/build/libs/ceclientmod-1.21.11-1.0.2.jar dist/
          sha256sum dist/*.jar > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-jei-bridge-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish plugin and mod releases
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ce-jei-bridge-${{ github.sha }}
          path: dist

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          required_assets=(
            "CraftEngineClientBridge-1.0.2-1.21.11.jar"
            "ceclientmod-1.21.11-1.0.2.jar"
            "SHA256SUMS.txt"
          )
          for asset in "${required_assets[@]}"; do
            test -f "dist/$asset" || {
              echo "Missing release asset: dist/$asset" >&2
              exit 1
            }
          done

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="latest"
            release_title="Latest main build"
            release_notes="Automatic build from main commit $GITHUB_SHA."
            release_create_flags=(--prerelease --latest=false)
          else
            release_tag="$GITHUB_REF_NAME"
            release_title="$GITHUB_REF_NAME"
            release_notes="Build artifacts for $GITHUB_REF_NAME."
            release_create_flags=(--verify-tag --generate-notes --latest=false)
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
            if [[ "$release_tag" == "latest" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                -f "sha=${GITHUB_SHA}" -F "force=true" >/dev/null
              gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes" --prerelease --latest=false
            fi
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes" \
              "${release_create_flags[@]}" dist/*
          fi
